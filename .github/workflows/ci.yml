name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # This repo has no Xcode/Swift toolchain available in the development
    # sandbox it was built in - this job is the first and only place any
    # of this has actually been compiled. See docs/project-memory/06-ops.md.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest available Xcode
        # /Applications/Xcode.app on this runner image resolves to an
        # older Xcode than the pbxproj format XcodeGen's latest release
        # writes by default ("cannot be opened because it is in a future
        # Xcode project file format" if an older Xcode is selected) -
        # macOS runner images ship several Xcode versions side by side
        # under /Applications/Xcode_<version>.app, so pick the newest one
        # actually installed rather than trusting the default symlink.
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then
            LATEST=/Applications/Xcode.app
          fi
          echo "Selecting $LATEST"
          sudo xcode-select -switch "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        # Picking a device name via `simctl` alone (the previous approach)
        # can name a device that exists only on older iOS runtimes, which
        # then fails to resolve against xcodebuild's implicit `OS:latest`
        # - e.g. this runner has "iPhone 15 Pro" simulators only up to iOS
        # 17.5, while its newest installed runtime is 18.2. Deriving both
        # the name AND the OS from the scheme's own `-showdestinations`
        # output guarantees a pairing that's actually valid for this
        # project, instead of guessing at one.
        run: |
          LINES=$(xcodebuild -showdestinations -project NotifyHubIOS.xcodeproj -scheme NotifyHubIOS 2>/dev/null \
            | grep "platform:iOS Simulator" | grep "name:iPhone")
          BEST=$(echo "$LINES" | while IFS= read -r line; do
            os=$(echo "$line" | grep -oE 'OS:[0-9.]+' | sed 's/OS://')
            [ -n "$os" ] && echo "$os|$line"
          done | sort -t'|' -k1,1V -r | head -n1 | cut -d'|' -f2-)

          if [ -z "$BEST" ]; then
            echo "No available iPhone simulator destination found" >&2
            xcodebuild -showdestinations -project NotifyHubIOS.xcodeproj -scheme NotifyHubIOS
            exit 1
          fi

          NAME=$(echo "$BEST" | grep -oE 'name:[^,}]+' | sed 's/name://' | sed -E 's/^ *//;s/ *$//')
          OS=$(echo "$BEST" | grep -oE 'OS:[0-9.]+' | sed 's/OS://')
          echo "Selected: name=$NAME OS=$OS"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "os=$OS" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build \
            -project NotifyHubIOS.xcodeproj \
            -scheme NotifyHubIOS \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=${{ steps.sim.outputs.os }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project NotifyHubIOS.xcodeproj \
            -scheme NotifyHubIOS \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=${{ steps.sim.outputs.os }}" \
            CODE_SIGNING_ALLOWED=NO

  # A `dependency-review` job (actions/dependency-review-action) is not
  # configured here for the same reason notifyhub's CI omits it: it
  # requires the repository's "Dependency graph" setting enabled, an
  # account-level toggle outside this workflow's control. This repo has
  # no external Swift package dependencies today, so Dependabot's
  # `.github/dependabot.yml` swift/github-actions ecosystems are the
  # ongoing coverage.
